name: Seed Painel
on:
  workflow_dispatch: {}
  push:
    branches: [ main ]
    paths:
      - 'materiais/painel_data.json'
jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Gravar painel_blob no Supabase
        env:
          SUPABASE_URL: https://pwbcehrfhspgipjhaedc.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python sistema/db/seed_painel.py
