<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Links das Praças</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{--pg:#0B0906;--pn:#141009;--pn2:#1A150C;--ln:#2A2213;--ln2:#3A3018;--ink:#F3ECDA;--ink2:#B6A883;--ink3:#7C7256;--ous:#F1CE68;--gold-d:#B8862B;--vd:#5CC98A;--grad:linear-gradient(100deg,#FBEDB4,#F1CE68 40%,#CFA23B 70%,#F7DE8C);--serif:'Spectral',Georgia,serif;--sans:'Inter',-apple-system,BlinkMacSystemFont,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(120% 80% at 85% -10%,rgba(233,194,90,.10),transparent 60%),var(--pg);color:var(--ink);font-family:var(--sans);padding:clamp(16px,3vw,30px);-webkit-font-smoothing:antialiased}
.wrap{max-width:900px;margin:0 auto}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-d)}
h1{font-family:var(--serif);font-size:clamp(24px,4vw,32px);font-weight:800;margin:4px 0 6px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--ink2);font-size:13px;margin-bottom:18px;line-height:1.5}
.sub b{color:var(--ous)}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.search{flex:1;min-width:180px;background:var(--pn2);color:var(--ink);border:1px solid var(--ln);border-radius:9px;padding:10px 12px;font:14px var(--sans)}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--ln);border-radius:11px;background:var(--pn);margin-bottom:8px}
.row .nm{font-weight:700;font-size:14px;min-width:150px;flex:0 0 auto}
.row .lk{flex:1;font-size:11.5px;color:var(--ink3);font-family:ui-monospace,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{background:var(--grad);color:#241a06;border:none;border-radius:8px;padding:8px 14px;font:700 12.5px var(--sans);cursor:pointer;flex:0 0 auto}
.btn.ok{background:var(--vd);color:#092216}
.foot{margin-top:18px;color:var(--ink3);font-size:11.5px;line-height:1.6;border-top:1px solid var(--ln);padding-top:12px}
.empty{color:var(--ink2);text-align:center;padding:40px}
@media(max-width:620px){.row{flex-wrap:wrap}.row .nm{min-width:0}.row .lk{order:3;width:100%;white-space:normal}}
</style>
<script>window.AGO_AUTH={audience:"team",title:"Links das Praças",sub:"Acesso restrito aos sócios. Digite a Senha Sócio."};</script>
<script src="sbauth.js"></script>
</head>
<body><div class="wrap" id="app"><div class="empty">Carregando…</div></div>
<script>
var SB="https://pwbcehrfhspgipjhaedc.supabase.co",KEY="sb_publishable_mTx5xlUaUcLBM_YijXuCjg_vwCJ5v3x";
function api(p){return fetch(SB+"/rest/v1/"+p,{headers:{apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json"}}).then(function(r){if(!r.ok)return r.text().then(function(t){throw new Error(t||r.status)});return r.json()})}
function linkFor(slug){return new URL("torre_praca.html?u="+encodeURIComponent(slug),location.href).href}
var LIST=[];
function draw(filter){
  var app=document.getElementById("app");
  var rows=LIST.filter(function(p){return !filter||p.nome.toLowerCase().indexOf(filter.toLowerCase())>=0});
  var html='<div class="eyebrow">Ageodonto · Direção Comercial</div><h1>Links das Praças</h1>'+
    '<div class="sub">Um link por praça pra Torre do dentista. Envie o <b>link</b> + a <b>Senha AGO</b> pro dentista da unidade. Cada link abre <b>só a praça dele</b>.</div>'+
    '<div class="tools"><input class="search" id="q" placeholder="Buscar praça…" value="'+(filter||"")+'"><button class="btn" id="copyall">Copiar todos</button></div>'+
    '<div id="list">'+(rows.length?rows.map(function(p){var l=linkFor(p.slug);return '<div class="row"><span class="nm">'+p.nome+'</span><span class="lk">'+l+'</span><button class="btn" data-l="'+l+'">Copiar</button></div>'}).join(''):'<div class="empty">Nenhuma praça.</div>')+'</div>'+
    '<div class="foot">'+LIST.length+' praças · os links se ajustam sozinhos se o endereço do sistema mudar. Fonte: banco (torre_snapshot).</div>';
  app.innerHTML=html;
  var q=document.getElementById("q");q.oninput=function(){var v=q.value;draw(v);setTimeout(function(){var e=document.getElementById("q");e.focus();e.setSelectionRange(v.length,v.length);},0);};
  document.querySelectorAll("[data-l]").forEach(function(b){b.onclick=function(){navigator.clipboard.writeText(b.dataset.l).then(function(){b.textContent="Copiado!";b.classList.add("ok");setTimeout(function(){b.textContent="Copiar";b.classList.remove("ok");},1500);});};});
  document.getElementById("copyall").onclick=function(){var t=rows.map(function(p){return p.nome+": "+linkFor(p.slug)}).join("\\n");navigator.clipboard.writeText(t).then(function(){var b=document.getElementById("copyall");b.textContent="Copiado!";b.classList.add("ok");setTimeout(function(){b.textContent="Copiar todos";b.classList.remove("ok");},1500);});};
}
api("torre_snapshot?select=slug,nome&order=nome").then(function(rows){LIST=rows;draw("");}).catch(function(e){document.getElementById("app").innerHTML='<div class="empty">Não foi possível carregar. '+(e&&e.message||"")+'</div>'});
</script>
</body></html>
