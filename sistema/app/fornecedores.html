<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Fornecedores — AGO</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{--pg:#0B0906;--pn:#141009;--pn2:#1A150C;--ln:#2A2213;--ln2:#3A3018;--ink:#F3ECDA;--ink2:#B6A883;--ink3:#7C7256;--ous:#F1CE68;--gold:#F1CE68;--gold-d:#B8862B;--vd:#5CC98A;--vm:#E0796B;--grad:linear-gradient(100deg,#FBEDB4,#F1CE68 40%,#CFA23B 70%,#F7DE8C);--serif:'Spectral',Georgia,serif;--sans:'Inter',-apple-system,sans-serif;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--pg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;padding:clamp(14px,2.5vw,28px)}
.wrap{max-width:1080px;margin:auto}
h1,h2,h3{font-family:var(--serif);margin:0}
.top{border-bottom:1px solid var(--ln);padding-bottom:14px;margin-bottom:4px}
.ey{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-d);font-weight:700}
.top h1{font-size:22px;margin-top:3px}
.tabs{display:flex;gap:6px;margin:18px 0}
.tab{border:1px solid var(--ln);border-radius:8px;padding:9px 15px;font:700 13px var(--sans);cursor:pointer;background:var(--pn);color:var(--ink2)}
.tab.on{background:var(--grad);color:#241a06;border-color:transparent}
.panel{display:none}.panel.on{display:block}
.box{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:18px;margin-bottom:14px}
.box h2{font-size:17px}.sub{font-size:12px;color:var(--ink3);margin:4px 0 15px}
.row{display:grid;gap:12px;margin-bottom:12px}.r2{grid-template-columns:repeat(2,1fr)}.r3{grid-template-columns:1.4fr .8fr 1fr}
@media(max-width:700px){.r2,.r3{grid-template-columns:1fr}}
label{display:block;font-size:10px;text-transform:uppercase;color:var(--ink3);font-weight:700;margin-bottom:5px;letter-spacing:.04em}
input,select,textarea{width:100%;background:var(--pn2);color:var(--ink);border:1px solid var(--ln);border-radius:7px;padding:10px;font:14px var(--sans)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold-d)}
textarea{min-height:150px;resize:vertical;line-height:1.5}
select[multiple]{min-height:118px}
.btn{border:1px solid transparent;border-radius:8px;padding:10px 18px;font:800 13px var(--sans);cursor:pointer;background:var(--grad);color:#241a06}
.btn.ghost{background:transparent;color:var(--ink2);border-color:var(--ln)}
.msg{font-size:12.5px;margin-left:10px}.ok{color:var(--vd)}.err{color:var(--vm)}
.filtros{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:10px;margin-bottom:14px}
@media(max-width:700px){.filtros{grid-template-columns:1fr}}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:15px 17px;margin-bottom:11px}
.card .hd{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.card .forn{font-family:var(--serif);font-size:17px;font-weight:700;color:var(--ous)}
.card .dt{font-size:12px;color:var(--ink3);font-weight:600}
.card .ass{font-size:13.5px;color:var(--ink);margin-top:3px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.chip{font-size:10.5px;font-weight:700;color:var(--ink2);background:var(--pn2);border:1px solid var(--ln);border-radius:20px;padding:3px 10px}
.verbtn{margin-top:11px;font-size:12px;font-weight:700;color:var(--ous);background:none;border:none;cursor:pointer;padding:0}
.trans{display:none;margin-top:11px;padding:12px 14px;background:var(--pn2);border:1px solid var(--ln);border-radius:9px;font-size:13px;color:var(--ink2);line-height:1.6;white-space:pre-wrap}
.trans.on{display:block}
.empty{text-align:center;color:var(--ink3);font-size:13px;padding:26px;border:1px dashed var(--ln);border-radius:10px}
mark{background:rgba(241,206,104,.28);color:var(--ink);border-radius:2px}
</style></head>
<body><div class="wrap">
<div class="top"><div class="ey">Gestão Comercial</div><h1>Reuniões com Fornecedores</h1></div>
<div class="tabs"><button class="tab on" data-p="nova">Nova reunião</button><button class="tab" data-p="hist">Histórico</button></div>

<section class="panel on" id="p-nova">
  <div class="box"><h2>Registrar reunião</h2><div class="sub">Guarde a data, o assunto e a transcrição. Marque as praças comentadas para poder voltar ao tema por praça depois.</div>
    <div class="row r3">
      <div><label>Fornecedor</label><input id="f-forn" list="forn-list" placeholder="Nome do fornecedor"><datalist id="forn-list"></datalist></div>
      <div><label>Data da reunião</label><input id="f-data" type="date"></div>
      <div><label>Assunto (resumo curto)</label><input id="f-assunto" placeholder="Ex.: taxas de cartão / insumos"></div>
    </div>
    <div class="row r2">
      <div><label>Praças comentadas <span style="color:var(--ink3);text-transform:none;font-weight:400">(ctrl/cmd p/ várias; opcional)</span></label><select id="f-pracas" multiple></select></div>
      <div><label>Transcrição</label><textarea id="f-trans" placeholder="Cole aqui a transcrição / anotações da reunião"></textarea></div>
    </div>
    <button class="btn" id="f-save">Salvar reunião</button> <span class="msg" id="f-msg"></span>
  </div>
</section>

<section class="panel" id="p-hist">
  <div class="filtros">
    <div><label>Fornecedor</label><select id="h-forn"><option value="">Todos</option></select></div>
    <div><label>Praça</label><select id="h-praca"><option value="">Todas</option></select></div>
    <div><label>Buscar no texto</label><input id="h-busca" placeholder="tema, palavra, nome…"></div>
  </div>
  <div id="lista"><div class="empty">Carregando…</div></div>
</section>

<script>window.AGO_AUTH={audience:"team",title:"Gestão Comercial AGO"};</script>
<script src="sbauth.js"></script>
<script>
var SB_URL="https://pwbcehrfhspgipjhaedc.supabase.co";
var SB_KEY="sb_publishable_mTx5xlUaUcLBM_YijXuCjg_vwCJ5v3x";
var HEAD={apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json"};
function api(path,opt){opt=opt||{};return fetch(SB_URL+"/rest/v1/"+path,{method:opt.method||"GET",headers:Object.assign({},HEAD,opt.headers||{}),body:opt.body?JSON.stringify(opt.body):undefined}).then(function(r){if(!r.ok)return r.text().then(function(t){throw Error(t||r.status)});return r.text().then(function(t){return t?JSON.parse(t):[]});});}
function esc(s){return (s==null?"":""+s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmtData(d){return d?(""+d).split("-").reverse().join("/"):"—";}
var DADOS=[];

document.querySelectorAll('.tab').forEach(function(t){t.onclick=function(){document.querySelectorAll('.tab,.panel').forEach(function(x){x.classList.remove('on')});t.classList.add('on');document.getElementById('p-'+t.dataset.p).classList.add('on');if(t.dataset.p==='hist')carregar();};});

// carregar clínicas p/ os selects de praça
api("clinicas?select=nome&order=nome").then(function(cls){
  var opts=cls.map(function(c){return '<option value="'+esc(c.nome)+'">'+esc(c.nome)+'</option>';}).join('');
  document.getElementById("f-pracas").innerHTML=opts;
  document.getElementById("h-praca").innerHTML='<option value="">Todas</option>'+opts;
}).catch(function(){});

document.getElementById("f-data").value=new Date().toISOString().slice(0,10);

document.getElementById("f-save").onclick=function(){
  var forn=document.getElementById("f-forn").value.trim();
  if(!forn){return flash("Informe o fornecedor.",false);}
  var pracas=[].slice.call(document.getElementById("f-pracas").selectedOptions).map(function(o){return o.value;});
  var body={fornecedor:forn,data:document.getElementById("f-data").value||null,assunto:document.getElementById("f-assunto").value.trim()||null,transcricao:document.getElementById("f-trans").value.trim()||null,pracas:pracas,criado_por:"Gregori"};
  api("reunioes_fornecedor",{method:"POST",headers:{Prefer:"return=minimal"},body:body}).then(function(){
    flash("Reunião salva.",true);
    document.getElementById("f-assunto").value="";document.getElementById("f-trans").value="";
    [].slice.call(document.getElementById("f-pracas").options).forEach(function(o){o.selected=false;});
  }).catch(function(e){flash("Erro: "+e.message,false);});
};
function flash(m,ok){var e=document.getElementById("f-msg");e.textContent=m;e.className="msg "+(ok?"ok":"err");setTimeout(function(){e.textContent="";},4000);}

function carregar(){
  api("reunioes_fornecedor?select=*&order=data.desc,criado_em.desc").then(function(rows){
    DADOS=rows||[];
    var fs={};DADOS.forEach(function(r){if(r.fornecedor)fs[r.fornecedor]=1;});
    var sel=document.getElementById("h-forn"),cur=sel.value;
    sel.innerHTML='<option value="">Todos</option>'+Object.keys(fs).sort().map(function(f){return '<option value="'+esc(f)+'">'+esc(f)+'</option>';}).join('');
    sel.value=cur;
    render();
  }).catch(function(e){document.getElementById("lista").innerHTML='<div class="empty err" style="color:var(--vm)">Erro ao carregar. (Se acabou de criar a tabela <b>reunioes_fornecedor</b>, recarregue.)</div>';});
}
function render(){
  var ff=document.getElementById("h-forn").value, fp=document.getElementById("h-praca").value, fb=document.getElementById("h-busca").value.trim().toLowerCase();
  var rows=DADOS.filter(function(r){
    if(ff && r.fornecedor!==ff)return false;
    if(fp && !((r.pracas||[]).indexOf(fp)>=0))return false;
    if(fb){var hay=((r.fornecedor||"")+" "+(r.assunto||"")+" "+(r.transcricao||"")+" "+((r.pracas||[]).join(" "))).toLowerCase();if(hay.indexOf(fb)<0)return false;}
    return true;
  });
  var L=document.getElementById("lista");
  if(!rows.length){L.innerHTML='<div class="empty">Nenhuma reunião'+(ff||fp||fb?' com esses filtros':' registrada ainda')+'.</div>';return;}
  function hl(s){if(!fb||!s)return esc(s);var i=(""+s).toLowerCase().indexOf(fb);if(i<0)return esc(s);return esc((""+s).slice(0,i))+'<mark>'+esc((""+s).slice(i,i+fb.length))+'</mark>'+esc((""+s).slice(i+fb.length));}
  L.innerHTML=rows.map(function(r,i){
    var chips=(r.pracas||[]).map(function(p){return '<span class="chip">'+esc(p)+'</span>';}).join('');
    var tr=r.transcricao?'<button class="verbtn" data-t="'+i+'">ver transcrição ▾</button><div class="trans" id="tr'+i+'">'+hl(r.transcricao)+'</div>':'<div style="font-size:12px;color:var(--ink3);margin-top:9px">sem transcrição</div>';
    return '<div class="card"><div class="hd"><span class="forn">'+esc(r.fornecedor||"—")+'</span><span class="dt">'+fmtData(r.data)+'</span></div>'
      +(r.assunto?'<div class="ass">'+hl(r.assunto)+'</div>':'')
      +(chips?'<div class="chips">'+chips+'</div>':'')+tr+'</div>';
  }).join('');
  L.querySelectorAll('.verbtn').forEach(function(b){b.onclick=function(){var d=document.getElementById('tr'+b.dataset.t);d.classList.toggle('on');b.textContent=d.classList.contains('on')?'ocultar transcrição ▴':'ver transcrição ▾';};});
}
["h-forn","h-praca"].forEach(function(id){document.getElementById(id).onchange=render;});
document.getElementById("h-busca").addEventListener("input",render);
</script>
</div></body></html>
