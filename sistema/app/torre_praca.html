<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Torre da Praça — Ageodonto</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{--pg:#0B0906;--pn:#141009;--pn2:#1A150C;--ln:#2A2213;--ln2:#3A3018;--ink:#F3ECDA;--ink2:#B6A883;--ink3:#7C7256;--ous:#F1CE68;--gold-d:#B8862B;--vd:#5CC98A;--am:#E8B54D;--vm:#E0796B;--grad:linear-gradient(100deg,#FBEDB4,#F1CE68 40%,#CFA23B 70%,#F7DE8C);--serif:'Spectral',Georgia,serif;--sans:'Inter',-apple-system,BlinkMacSystemFont,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(120% 80% at 85% -10%,rgba(233,194,90,.10),transparent 60%),var(--pg);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased;padding:clamp(16px,3vw,34px);min-height:100vh}
.wrap{max-width:1080px;margin:0 auto}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-d)}
h1{font-family:var(--serif);font-size:clamp(28px,5.5vw,46px);font-weight:800;letter-spacing:-.01em;margin:5px 0 6px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--ink2);font-size:13.5px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:2px}
.chip{background:var(--pn);border:1px solid var(--ln);border-radius:999px;padding:5px 12px;font-size:12px;color:var(--ink2)}
.chip b{color:var(--ous)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:22px}
.card{background:linear-gradient(180deg,var(--pn),var(--pg));border:1px solid var(--ln);border-left:4px solid var(--cc,var(--ln));border-radius:15px;padding:17px 18px 15px;position:relative}
.card .lbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.card .val{font-family:var(--serif);font-weight:800;font-size:31px;line-height:1.05;margin:9px 0 2px;color:var(--ink);font-variant-numeric:tabular-nums}
.card .meta{font-size:12.5px;color:var(--ink2);margin-top:5px;line-height:1.4}
.card .meta b{color:var(--ink)}
.badge{display:inline-flex;align-items:center;gap:6px;margin-top:11px;font-size:12px;font-weight:800;padding:4px 11px;border-radius:20px}
.badge .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.b-g{color:#0c2a19;background:var(--vd)}.b-a{color:#3a2b06;background:var(--am)}.b-r{color:#3a120d;background:var(--vm)}.b-na{color:var(--ink2);background:var(--pn2);border:1px solid var(--ln)}
.foot{margin:26px 2px 0;color:var(--ink3);font-size:11.5px;line-height:1.7;border-top:1px solid var(--ln);padding-top:14px}
.foot b{color:var(--ink2)}
.foot a{color:var(--ink3);text-decoration:underline;cursor:pointer}
.empty{max-width:560px;margin:12vh auto 0;text-align:center;background:var(--pn);border:1px solid var(--ln);border-radius:16px;padding:34px 30px}
.empty h2{font-family:var(--serif);font-size:24px;font-weight:800;color:var(--ink);margin-bottom:10px}
.empty p{color:var(--ink2);font-size:14px}
</style>
<script>window.AGO_AUTH={audience:"praca",title:"Torre da sua praça",sub:"Digite a Senha AGO que a Direção Comercial te enviou."};</script>
<script src="sbauth.js"></script>
</head>
<body><div class="wrap" id="app"><div class="empty"><h2>Carregando…</h2><p>Um instante.</p></div></div>
<script>
var SB="https://pwbcehrfhspgipjhaedc.supabase.co",KEY="sb_publishable_mTx5xlUaUcLBM_YijXuCjg_vwCJ5v3x";
var IND=[{k:"fat",lbl:"Faturamento",fmt:"rs",type:"cum"},{k:"recompra",lbl:"Recompra",fmt:"rs",type:"cum"},{k:"entrada",lbl:"Entrada",fmt:"rs",type:"cum"},{k:"aval",lbl:"Avaliações",fmt:"num",type:"cum"},{k:"conv",lbl:"Conversão",fmt:"pct",type:"rate"},{k:"tk",lbl:"Ticket médio",fmt:"rs",type:"rate"},{k:"d30",lbl:"30+",fmt:"rs",type:"cum"},{k:"parc",lbl:"Parcelamento",fmt:"x",type:"ceiling"}];
function qp(n){try{return new URLSearchParams(location.search).get(n)||""}catch(e){return ""}}
function farolClass(f){return f==="g"?"b-g":f==="a"?"b-a":f==="r"?"b-r":"b-na"}
function farolCol(f){return f==="g"?"var(--vd)":f==="a"?"var(--am)":f==="r"?"var(--vm)":"var(--ln)"}
function farolTxt(f,type){if(f==="na")return "sem meta";if(type==="ceiling")return f==="g"?"dentro do teto":f==="a"?"no limite":"acima do teto";return f==="g"?"no alvo":f==="a"?"atenção":"abaixo"}
function fmt(v,f){if(v==null)return "—";if(f==="rs")return "R$ "+Math.round(v).toLocaleString("pt-BR");if(f==="num")return Math.round(v).toLocaleString("pt-BR");if(f==="pct")return (v*100).toFixed(1).replace(".",",")+"%";if(f==="x")return v.toFixed(1).replace(".",",")+"×";return String(v)}
function pctTxt(p){return p==null?"—":Math.round(p*100)+"%"}
function api(path){return fetch(SB+"/rest/v1/"+path,{headers:{apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json"}}).then(function(r){if(!r.ok)return r.text().then(function(t){throw new Error(t||r.status)});return r.json()})}
function render(pr){
  var app=document.getElementById("app");
  var M={mes:pr.mes,dia:pr.dia,dias:pr.dias};
  var cards=IND.map(function(ind){
    var a=(pr.ind||{})[ind.k]; if(!a)return "";
    var meta=a[0],real=a[1],proj=a[2],pct=a[3],farol=a[4];
    var metaLine;
    if(ind.type==="cum"){metaLine="Meta <b>"+fmt(meta,ind.fmt)+"</b>"+(proj!=null?" · projeção <b>"+fmt(proj,ind.fmt)+"</b>":"")}
    else if(ind.type==="ceiling"){metaLine="Teto <b>"+fmt(meta,ind.fmt)+"</b>"}
    else{metaLine="Meta <b>"+fmt(meta,ind.fmt)+"</b>"}
    return '<div class="card" style="--cc:'+farolCol(farol)+'"><div class="lbl">'+ind.lbl+'</div><div class="val">'+fmt(real,ind.fmt)+'</div><div class="meta">'+metaLine+'</div><div class="badge '+farolClass(farol)+'"><span class="dot"></span>'+(pct!=null?pctTxt(pct)+" da meta · ":"")+farolTxt(farol,ind.type)+'</div></div>';
  }).join("");
  app.innerHTML='<div class="eyebrow">Ageodonto · Torre da Praça</div><h1>'+pr.nome+'</h1>'+
    '<div class="sub"><span class="chip">Competência <b>'+(M.mes||"")+'</b></span><span class="chip">'+(pr.ref||"")+'</span><span class="chip">dia <b>'+M.dia+"/"+M.dias+'</b> · projeção de fechamento</span></div>'+
    '<div class="grid">'+cards+'</div>'+
    '<div class="foot"><b>Como ler.</b> <b>Realizado</b> = o que já entrou no mês. <b>Projeção</b> = estimativa de fechamento no ritmo atual para os indicadores que acumulam (faturamento, recompra, entrada, avaliações, 30+). <b>Conversão</b> e <b>ticket</b> são taxas. <b>Parcelamento</b> é teto — quanto menor, melhor. Farol: <span style="color:var(--vd)">verde no alvo</span> · <span style="color:var(--am)">amarelo atenção</span> · <span style="color:var(--vm)">vermelho abaixo</span>. Fonte: Giga, atualizado pela Direção Comercial. · <a onclick="agoLogout()">sair</a></div>';
  document.title="Torre — "+pr.nome+" · Ageodonto";
}
function boot(){
  var slug=qp("u")||qp("p");
  var app=document.getElementById("app");
  if(!slug){app.innerHTML='<div class="empty"><h2>Torre da sua praça</h2><p>Abra pelo <b>link exclusivo da sua praça</b> que você recebeu. Se não tiver o link, fale com a Direção Comercial.</p></div>';return}
  api("torre_snapshot?slug=eq."+encodeURIComponent(slug)+"&select=nome,dados").then(function(rows){
    if(!rows.length){app.innerHTML='<div class="empty"><h2>Praça não encontrada</h2><p>Confira o link com a Direção Comercial. <a onclick="agoLogout()" style="color:var(--ous);cursor:pointer">sair</a></p></div>';return}
    var d=rows[0].dados||{}; d.nome=d.nome||rows[0].nome; render(d);
  }).catch(function(e){app.innerHTML='<div class="empty"><h2>Não foi possível carregar</h2><p>'+(e&&e.message||"erro")+' <a onclick="agoLogout()" style="color:var(--ous);cursor:pointer">sair</a></p></div>'});
}
boot();
</script>
</body></html>
