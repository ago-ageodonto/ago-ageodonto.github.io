<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Sistema de Gestão Comercial — AGO</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{--pg:#0B0906;--pn:#141009;--pn2:#1A150C;--pn3:#201a0f;--ln:#2A2213;--ln2:#3A3018;--ink:#F3ECDA;--ink2:#B6A883;--ink3:#7C7256;--ous:#F1CE68;--gold-d:#B8862B;--vd:#5CC98A;--grad:linear-gradient(100deg,#FBEDB4,#F1CE68 40%,#CFA23B 70%,#F7DE8C);--serif:'Spectral',Georgia,serif;--sans:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--pg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;display:flex;height:100vh;overflow:hidden}
/* ===== sidebar ===== */
.side{width:250px;flex:0 0 250px;background:linear-gradient(180deg,#15100a,#0B0906);border-right:1px solid var(--ln);display:flex;flex-direction:column;padding:16px 12px 12px}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 15px;border-bottom:1px solid var(--ln)}
.brand img{height:38px;width:auto;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
.brand .e{font-size:8.5px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-d)}
.brand .t{font-family:var(--serif);font-size:15px;font-weight:800;line-height:1.05;color:var(--ink)}
nav{margin-top:12px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1}
nav::-webkit-scrollbar{width:6px}nav::-webkit-scrollbar-thumb{background:var(--ln2);border-radius:3px}
.grp{font-size:9.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);padding:14px 12px 6px}
.nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--ink2);cursor:pointer;border:1px solid transparent;text-align:left;background:none;font-family:var(--sans);width:100%;transition:background .12s,color .12s}
.nav:hover{background:var(--pn2);color:var(--ink)}
.nav.on{background:var(--grad);color:#241a06;font-weight:800;border-color:transparent;box-shadow:0 3px 12px rgba(241,206,104,.14)}
.nav .i{font-size:15px;width:20px;text-align:center;flex:0 0 20px}
.side .ft{font-size:10px;color:var(--ink3);padding:10px 10px 2px;border-top:1px solid var(--ln);line-height:1.55;margin-top:6px}
.side .ft .dot{color:var(--vd)}
/* ===== main ===== */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:15px 24px;border-bottom:1px solid var(--ln);background:linear-gradient(180deg,var(--pn),var(--pg))}
.top .ttl{display:flex;align-items:center;gap:13px;min-width:0}
.top .ic{font-size:22px}
.top h1{font-family:var(--serif);font-size:19px;font-weight:800;line-height:1.1;color:var(--ink)}
.top .bc{font-size:11px;color:var(--ink3);font-weight:600;letter-spacing:.04em}
.top .act{display:flex;align-items:center;gap:9px;flex:0 0 auto}
.badge{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;color:var(--ink2);background:var(--pn2);border:1px solid var(--ln);border-radius:999px;padding:6px 12px}
.badge .d{width:7px;height:7px;border-radius:50%;background:var(--vd);box-shadow:0 0 8px var(--vd)}
.top .ob{font-size:12px;font-weight:700;color:var(--ink2);background:transparent;border:1px solid var(--ln);border-radius:8px;padding:7px 12px;cursor:pointer;text-decoration:none}
.top .ob:hover{background:var(--pn2);color:var(--ink)}
iframe{flex:1;width:100%;border:0;background:var(--pg)}
.hamb{display:none}
/* ===== mobile ===== */
@media(max-width:820px){
  body{flex-direction:column;overflow:hidden}
  .side{position:fixed;z-index:40;left:0;top:0;bottom:0;width:255px;transform:translateX(-105%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.6)}
  body.menu .side{transform:none}
  .main{flex:1;height:100vh}
  .hamb{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:9px;border:1px solid var(--ln);background:var(--pn2);color:var(--ink);font-size:18px;cursor:pointer;flex:0 0 auto}
  .top{padding:12px 14px}.top h1{font-size:16px}
  .scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:35}
  body.menu .scrim{display:block}
}
</style></head>
<body>
<aside class="side" id="side">
  <div class="brand"><img src="ageodonto_logo.png" alt="AGO"><div><div class="e">Gestão Comercial</div><div class="t">Sistema AGO</div></div></div>
  <nav id="nav">
    <div class="grp">Panorama</div>
    <button class="nav on" data-v="torre.html" data-nav="torre" data-ic="🗼" data-t="Torre de Controle" data-bc="Panorama · rede vs metas"><span class="i">🗼</span> Torre de Controle</button>
    <button class="nav" data-v="../../materiais/painel_resultados.html" data-nav="painel" data-ic="📊" data-t="Painel de Resultados" data-bc="Panorama · apontamentos da rede"><span class="i">📊</span> Painel de Resultados</button>
    <div class="grp">Acompanhamento</div>
    <button class="nav" data-v="rede.html" data-nav="rede" data-ic="🏙️" data-t="Rede" data-bc="Acompanhamento · farol por unidade"><span class="i">🏙️</span> Rede</button>
    <button class="nav" data-v="geral.html" data-nav="geral" data-ic="📈" data-t="Visão Geral" data-bc="Acompanhamento · analytics da rede"><span class="i">📈</span> Visão Geral</button>
    <button class="nav" data-v="gestao_avaliadores.html" data-nav="aval" data-ic="🗓️" data-t="Reuniões / Histórico" data-bc="Acompanhamento · avaliação quinzenal e histórico"><span class="i">🗓️</span> Reuniões/Histórico</button>
    <button class="nav" data-v="avaliador.html" data-nav="painelav" data-ic="🧑‍💼" data-t="Painel do Avaliador" data-bc="Acompanhamento · desempenho do avaliador"><span class="i">🧑‍💼</span> Painel do Avaliador</button>
    <div class="grp">Administração</div>
    <button class="nav" data-v="console.html" data-nav="console" data-ic="🗂️" data-t="Console" data-bc="Administração · cadastros e notas"><span class="i">🗂️</span> Console</button>
  </nav>
  <button class="nav" onclick="if(window.agoLogout)agoLogout()" style="margin-top:8px;color:var(--vm)"><span class="i">⏻</span> Sair</button>
  <div class="ft"><span class="dot">●</span> conectado ao Supabase<br>Ageodonto · acompanhamento por indicador</div>
</aside>
<div class="scrim" id="scrim"></div>
<div class="main">
  <header class="top">
    <div class="ttl">
      <button class="hamb" id="hamb" aria-label="menu">☰</button>
      <span class="ic" id="h-ic">🗼</span>
      <div><h1 id="h-ttl">Torre de Controle</h1><div class="bc" id="h-bc">Panorama · rede vs metas</div></div>
    </div>
    <div class="act">
      <a class="ob" id="h-open" target="_blank" rel="noreferrer" href="torre.html">Abrir em nova aba ↗</a>
      <span class="badge"><span class="d"></span> no ar</span>
    </div>
  </header>
  <iframe id="view" src="torre.html" title="conteúdo"></iframe>
</div>
<script>window.AGO_AUTH={audience:"team",title:"Gestão Comercial AGO"};</script>
<script src="sbauth.js"></script>
<script>
var frame=document.getElementById("view"),body=document.body;
function activate(btn){
  document.querySelectorAll(".nav").forEach(function(b){b.classList.toggle("on",b===btn)});
  frame.src=btn.dataset.v;
  document.getElementById("h-ic").textContent=btn.dataset.ic;
  document.getElementById("h-ttl").textContent=btn.dataset.t;
  document.getElementById("h-bc").textContent=btn.dataset.bc;
  document.getElementById("h-open").href=btn.dataset.v;
  body.classList.remove("menu");
}
document.querySelectorAll(".nav[data-nav]").forEach(function(b){b.onclick=function(){activate(b)}});
function setNav(key){var b=document.querySelector('.nav[data-nav="'+key+'"]');if(b)activate(b);}
// hook chamado pela tela Rede/Visão Geral quando clica numa unidade
window.openDiretor=function(id){frame.src="dashboard.html?diretor="+encodeURIComponent(id);document.querySelectorAll(".nav").forEach(function(b){b.classList.remove("on")});document.getElementById("h-ic").textContent="👤";document.getElementById("h-ttl").textContent="Dashboard do Diretor";document.getElementById("h-bc").textContent="Acompanhamento · unidade selecionada";};
// mobile menu
var hamb=document.getElementById("hamb"),scrim=document.getElementById("scrim");
if(hamb)hamb.onclick=function(){body.classList.toggle("menu")};
if(scrim)scrim.onclick=function(){body.classList.remove("menu")};
</script>
</body></html>
