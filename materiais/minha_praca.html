    +'<div class="foot"><b>Como ler.</b> <b>Realizado</b> = o que já entrou no mês. <b>Projeção</b> = estimativa de fechamento no ritmo atual (pacing) para os indicadores que acumulam ao longo do mês (faturamento, recompra, entrada, avaliações, 30+). <b>Conversão</b> e <b>ticket</b> são taxas (comparadas direto à meta). <b>Parcelamento</b> é teto — quanto menor, melhor. Farol: <span style="color:var(--vd)">verde no alvo</span> · <span style="color:var(--am)">amarelo atenção</span> · <span style="color:var(--vm)">vermelho abaixo</span>. Fonte: Giga, atualizado pela Direção Comercial.</div>';
  document.title='Torre — '+pr.nome+' · Ageodonto';
}
render();
</script>
